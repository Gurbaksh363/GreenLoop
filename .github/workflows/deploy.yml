name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      # Triggers the workflow every time code is pushed to the main branch
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up SSH Key and Deploy to EC2
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}          # Your EC2 Public IP address
          username: ${{ secrets.EC2_USERNAME }}  # Typically 'ubuntu' or 'ec2-user'
          key: ${{ secrets.EC2_SSH_KEY }}        # Your private SSH Key (.pem)
          port: 22
          command_timeout: 10m                   # Give the server plenty of time to run npm install and build
          script: |
            # 1. Navigate to the project directory on EC2
            cd /var/www/eco-waste-management-platform || exit

            # 2. Pull the latest code from GitHub (handles both fresh and existing setups)
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/Gurbaksh363/GreenLoop.git
              git fetch origin
              git reset --hard origin/main
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # 3. Create .env file if it is missing on the server
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            # 4. Build the new Docker image locally on EC2
            docker build -t greenloop-app .

            # 4. Stop and remove the old running container if it exists
            docker stop greenloop-container || true
            docker rm greenloop-container || true

            # 5. Fix permissions on the host volumes so the container's www-data user can write to them!
            sudo chmod -R 777 /var/www/eco-waste-management-platform/storage
            sudo chmod -R 777 /var/www/eco-waste-management-platform/database

            # 6. Run the new container with SQLite persistence and port mapping
            docker run -d \
              -p 80:80 \
              --name greenloop-container \
              --restart unless-stopped \
              -v /var/www/eco-waste-management-platform/database:/var/www/html/database \
              -v /var/www/eco-waste-management-platform/storage:/var/www/html/storage \
              -v /var/www/eco-waste-management-platform/.env:/var/www/html/.env \
              greenloop-app

            # 6. Generate the Laravel App Key inside the container to prevent HTTP 500 errors
            docker exec greenloop-container php artisan key:generate

            # 7. Run database migrations to ensure tables exist
            docker exec greenloop-container php artisan migrate --force
